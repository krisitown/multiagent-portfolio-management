name: Offline runtime checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run python scripts/validate_bundles.py
      - run: uv run pytest tests/unit tests/contracts tests/thin/test_portfolio_council.py tests/thin/test_direct_text_handoff.py tests/thin/test_continuity.py tests/thin/test_completion_observer.py tests/thin/test_fact_check_team.py -q -m "not live_model and not live_provider"
      - run: uv run pytest tests/thin/test_agents.py tests/thin/test_private_task_boundary.py tests/thin/test_owner_context.py tests/thin/test_portfolio_text.py tests/thin/test_lead_output_boundary.py tests/thin/test_lead_synthesis.py tests/thin/test_finalization_hooks.py tests/thin/test_option_response_view.py tests/thin/test_followup_prompt_view.py tests/thin/test_manager_first_handoffs.py tests/telemetry -q -m "not live_model and not live_provider" --junitxml=.local/agent-boundaries.xml
      - name: Annotate agent-boundary failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(".local/agent-boundaries.xml")
          if report.exists():
              for case in ET.parse(report).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      failure = case.find(kind)
                      if failure is not None:
                          detail = case.get("classname", "") + "::" + case.get("name", "")
                          detail += "\n" + (failure.text or failure.get("message", ""))
                          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print("::error title=Agent boundary regression::" + escaped)
          PY
      - run: uv run python examples/offline_demo.py
      - run: uv run python -m build
